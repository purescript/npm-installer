name: "CI"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ "published" ]

defaults:
  run:
    shell: "bash"

jobs:
  build:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        node: ["22.22.2", "22.x", "24.15.0", "24.x", "26.0.0", "26.x"]
    steps:
      - uses: "actions/checkout@v6"

      - uses: "actions/setup-node@v6"
        with:
          node-version: "${{ matrix.node }}"

      # Generate an ignored lockfile for npm audit, resolving ranges afresh.
      - run: npm install --engine-strict --no-fund --package-lock

      - run: npm audit

      - run: npm test

      - name: Verify the published dependency tree and CLI
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          npm pack --pack-destination "$tmp"
          npm install --prefix "$tmp/consumer" --engine-strict --no-fund --package-lock "$tmp"/*.tgz
          npm audit --prefix "$tmp/consumer"
          npm ls --prefix "$tmp/consumer" --all
          for attempt in 1 2; do
            (
              cd "$tmp/consumer"
              XDG_CACHE_HOME="$tmp/cache" node node_modules/purescript-installer/index.js --purs-ver 0.15.7
              test "$(./purs --version)" = 0.15.7
            )
          done
